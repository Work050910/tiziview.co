{{ if not .IsHome }}
<nav class="breadcrumbs" aria-label="breadcrumb">
  <a href="/">首页</a>
  <span>&gt;</span>
  {{ with .Parent }}
    {{ if not .IsHome }}
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      <span>&gt;</span>
    {{ end }}
  {{ end }}
  <span class="current" aria-current="page">{{ .Title }}</span>
</nav>
{{ end }}
